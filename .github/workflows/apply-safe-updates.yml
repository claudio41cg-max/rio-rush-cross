name: Apply safe gameplay and camera tuning

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safe-updates.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply tuning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def patch(path, changes):
              p = Path(path)
              s = p.read_text()
              for old, new in changes:
                  if old in s:
                      s = s.replace(old, new, 1)
                  elif new not in s:
                      raise SystemExit(f'Anchor not found in {path}: {old}')
              p.write_text(s)

          patch('src/kart/Kart.ts', [
              ('const ACCEL_BASE = 9.0;', 'const ACCEL_BASE = 10.2;'),
              ('const ACCEL_APPROACH = 2.2;', 'const ACCEL_APPROACH = 2.5;'),
              ('const BOOST_ACCEL = 45;', 'const BOOST_ACCEL = 52;'),
              ('const BOOST_APPROACH = 7;', 'const BOOST_APPROACH = 8;'),
              ('const BRAKE_DECEL = 16;', 'const BRAKE_DECEL = 18;'),
              ('const STEER_RATE = 1.9;', 'const STEER_RATE = 2.15;'),
              ('const DRIFT_STEER_RATE = 1.9;', 'const DRIFT_STEER_RATE = 2.05;'),
              ('const HOP_VELOCITY = 4.5;', 'const HOP_VELOCITY = 4.8;'),
              ('const HOP_DRIFT_DELAY = 0.15;', 'const HOP_DRIFT_DELAY = 0.11;'),
              ('const DRIFT_STAGE_THRESHOLDS: readonly number[] = [1.0, 2.0, 3.2];', 'const DRIFT_STAGE_THRESHOLDS: readonly number[] = [0.85, 1.75, 2.85];'),
              ('const DRIFT_BOOST_DURATIONS: readonly number[] = [0, 0.7, 1.2, 1.8];', 'const DRIFT_BOOST_DURATIONS: readonly number[] = [0, 0.85, 1.35, 2.05];'),
              ('const DRIFT_BOOST_STRENGTH = 0.4;', 'const DRIFT_BOOST_STRENGTH = 0.48;'),
          ])

          patch('src/game/FollowCamera.ts', [
              ('const CHASE_DISTANCE = 3.75;', 'const CHASE_DISTANCE = 3.45;'),
              ('const CHASE_HEIGHT = 1.94;', 'const CHASE_HEIGHT = 1.82;'),
              ('const FOV_MIN = 68;', 'const FOV_MIN = 66;'),
              ('const FOV_MAX = 80;', 'const FOV_MAX = 84;'),
              ('const YAW_LAMBDA = 6;', 'const YAW_LAMBDA = 7.2;'),
              ('const POS_LAMBDA = 16;', 'const POS_LAMBDA = 18;'),
          ])
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "claudio41cg-max"
          git config user.email "claudio41cg@gmail.com"
          git add src/kart/Kart.ts src/game/FollowCamera.ts
          git commit -m "Tune acceleration drift and chase camera" || exit 0
          git push
