name: Fix Copa Verao flow

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safe-updates.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply Copa Verao fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              if old in s:
                  s = s.replace(old, new, 1)
              elif new not in s:
                  raise SystemExit(f'Anchor not found: {label}')
              p.write_text(s)

          preview = 'src/ui/ChampionshipPreview.ts'
          old_preview = """    summerStart.addEventListener('click', (ev) => {
      stop(ev);
      summerPanel.classList.add('hidden');
      window.dispatchEvent(new Event('rc:start-summer-cup'));
    });
"""
          new_preview = """    summerStart.addEventListener('click', (ev) => {
      stop(ev);
      setSummerMode(true);
      sessionStorage.removeItem('rc-summer-race');
      summerPanel.classList.add('hidden');
      requestAnimationFrame(() => title.click());
    });
"""
          replace_once(preview, old_preview, new_preview, 'ChampionshipPreview summer start')

          native = 'src/ui/SummerChampionshipNative.ts'
          old_native = """  document.addEventListener('click', (event) => {
    const target = event.target as HTMLElement | null;
    const start = target?.closest<HTMLButtonElement>('.rc-summer-start');
    if (!start) return;

    event.preventDefault();
    event.stopPropagation();
    event.stopImmediatePropagation();

    sessionStorage.setItem('rc-championship', 'summer');
    sessionStorage.removeItem('rc-summer-race');
    document.body.classList.add('rc-summer-active');
    document.querySelector<HTMLElement>('.rc-summer-cup')?.classList.add('hidden');

    requestAnimationFrame(openCharacterSelect);
    scheduleEnforce();
  }, true);

"""
          replace_once(native, old_native, '', 'remove Native start interception')

          bridge = 'src/ui/SummerChampionshipBridge.ts'
          old_bridge = """// Intercepta o botão antigo antes do listener dele. Assim não existe mais clique
// sintético nem tentativa de iniciar corrida por trás da interface.
document.addEventListener(
  'click',
  (ev) => {
    const target = ev.target as HTMLElement | null;
    const start = target?.closest<HTMLButtonElement>('.rc-summer-start');
    if (!start) return;

    ev.preventDefault();
    ev.stopPropagation();
    ev.stopImmediatePropagation();

    sessionStorage.setItem('rc-championship', 'summer');
    sessionStorage.removeItem('rc-summer-race');
    document.body.classList.add('rc-summer-active');
    hideSummerPanel();

    requestAnimationFrame(() => {
      openCharacterSelect();
    });
  },
  true,
);

"""
          replace_once(bridge, old_bridge, '', 'remove Bridge start interception')

          # Keep helpers harmlessly present for compatibility; they no longer own the start button.
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "claudio41cg-max"
          git config user.email "claudio41cg@gmail.com"
          git add src/ui/ChampionshipPreview.ts src/ui/SummerChampionshipNative.ts src/ui/SummerChampionshipBridge.ts
          git commit -m "Fix Copa Verao start flow" || exit 0
          git push
