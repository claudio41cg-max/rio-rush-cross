name: Apply safe progress and mobile updates

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-safe-updates.yml

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply updates
        run: python3 scripts/apply-safe-updates.py
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit changes
        run: |
          git config user.name "claudio41cg-max"
          git config user.email "claudio41cg@gmail.com"
          git add src scripts/apply-safe-updates.py
          git commit -m "Integrate progress and mobile drift safely" || exit 0
          git push
